server:
  port: ${PORT:${SERVER_PORT:8081}}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.finstack.event
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finstack_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  cache:
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: ${CACHE_REDIS_TTL:300s}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    transaction-topic: ${KAFKA_TRANSACTION_TOPIC:finstack.transaction.events}
    fraud-topic: ${KAFKA_FRAUD_TOPIC:finstack.fraud.results}
    fraud-group: ${KAFKA_FRAUD_GROUP:finstack-fraud}
  email-verification:
    expiration-minutes: ${EMAIL_VERIFICATION_EXPIRATION_MINUTES:30}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    development-log-link: ${EMAIL_VERIFICATION_DEV_LOG_LINK:false}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
    development-log-link: ${PASSWORD_RESET_DEV_LOG_LINK:false}
